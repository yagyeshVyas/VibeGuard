name: Publish

# Provenance: npm publish with --provenance requires:
#   1. id-token: write permission (set below)
#   2. npm package linked to GitHub repo in npm settings
#   3. NPM_TOKEN secret in repo secrets
#   4. npm CLI >= 9.5.0 (Node 22 ships it)
#
# Users: this is the MAINTAINER's token (yours), not the user's.
# VibeGuard itself is 100% free — no API keys, no paid services.
# The npm token is only used by the maintainer to publish the package.

on:
  push:
    tags:
      - 'v*'
  # Manual release path: after refreshing the NPM_TOKEN secret, run this from the
  # default branch (`gh workflow run publish.yml --ref master`). Publishing is
  # idempotent for the release step below, so it can be retried safely.
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          # Updates an existing release instead of failing when a release for
          # this tag was created manually (recoveries, re-runs).
          allowUpdates: true
