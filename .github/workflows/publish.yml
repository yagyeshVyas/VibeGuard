name: Publish

# Provenance: npm publish with --provenance requires:
#   1. id-token: write permission (set below)
#   2. npm package linked to GitHub repo in npm settings
#   3. NPM_TOKEN secret in repo secrets
#   4. npm CLI >= 9.5.0 (Node 22 ships it)
#
# Users: this is the MAINTAINER's token (yours), not the user's.
# VibeGuard itself is 100% free — no API keys, no paid services.
# The npm token is only used by the maintainer to publish the package.
#
# Missing-token behavior: when NPM_TOKEN is not configured the publish and
# release steps are SKIPPED with a warning instead of failing the run. A
# missing credential is a setup state, not a broken build; failing every tag
# push sends noise and hides the real signal. An INVALID token still fails.
#
# Already-published behavior: if package.json's version is already on npm the
# publish step exits 0 with a notice, so re-running this workflow (a manual
# re-dispatch, a retried tag) cannot produce a false-red 403 publish conflict.

on:
  push:
    tags:
      - 'v*'
  # Manual release path: after setting the NPM_TOKEN secret, run this from the
  # default branch (`gh workflow run publish.yml --ref master`). Publishing is
  # idempotent for the release step below, so it can be retried safely.
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm test

      - name: Check npm credentials
        if: env.NODE_AUTH_TOKEN == ''
        run: |
          echo "::warning title=npm publish skipped::The repository secret NPM_TOKEN is not set, so this run published nothing."
          echo "Add a granular npm token (publish rights on @yagyeshvyas) as NPM_TOKEN, then run: gh workflow run publish.yml --ref master"

      - name: npm publish
        if: env.NODE_AUTH_TOKEN != ''
        # Idempotent: a version already on the registry is a successful no-op,
        # not a 403 that turns a retry/double-dispatch into a red run. Re-runs
        # then only refresh the release notes below.
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::notice title=npm publish skipped::$NAME@$VERSION is already on the registry; nothing republished."
            exit 0
          fi
          npm publish --provenance --access public

      - name: Read package version
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # Tag the release from package.json instead of the triggering ref: a
      # workflow_dispatch on master has no tag in refs/** and softprops fails
      # with "GitHub Releases requires a tag". On a tag run this resolves to the
      # same v<version> tag, and an existing release is updated in place.
      - name: Create GitHub Release
        if: env.NODE_AUTH_TOKEN != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.pkg.outputs.version }}
          generate_release_notes: true
