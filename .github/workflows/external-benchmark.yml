name: External security benchmark

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Fetch pinned target, scan, and gate against baseline
        run: node benchmarks/external/run.js --refresh --gate
      - name: Verify offline reproducibility against the committed report
        run: node benchmarks/external/run.js --offline --verify
      - uses: actions/upload-artifact@v7
        with:
          name: external-benchmark
          path: |
            reports/external-benchmark.json
            reports/external-benchmark.md
