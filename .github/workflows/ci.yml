name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - name: Benchmark quality gate (precision/recall/F1 regression)
        run: node test/benchmark/run.js --gate
      - name: Dependency audit (high/critical)
        run: npm audit --audit-level=high
      - name: Coverage
        run: npm run coverage
      - uses: actions/upload-artifact@v7
        if: matrix.node-version == 22
        with:
          name: coverage
          path: coverage/

  platform-security:
    name: platform security (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        node-version: [22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - name: Platform security suite (auth, policy, audit, sandbox, SSRF, JWT, HTTP)
        run: node test/run-platform.js
      - name: Sandbox backend truthfulness
        run: node bin/cli.js sandbox backends

  full-suite:
    name: full suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - name: Full test suite
        shell: bash
        run: |
          set -o pipefail
          node test/run.js 2>&1 | tee full-suite-${{ matrix.os }}.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: full-suite-${{ matrix.os }}
          path: full-suite-${{ matrix.os }}.txt
